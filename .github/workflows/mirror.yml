name: Mirror emulators

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mirror
  cancel-in-progress: false

env:
  # EmuDeck branch whose Python installers decide what gets mirrored
  EMUDECK_REF: dev-hybrid

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: EmuDeck/EmuDeck
          ref: ${{ env.EMUDECK_REF }}
          path: emudeck

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install EmuDeck Python dependencies
        run: pip install requests vdf screeninfo

      - name: Mirror releases
        run: python mirror.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EMUDECK_REPO: emudeck

      # GitHub disables scheduled workflows after 60 days without commits
      - name: Keep the schedule alive
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep the mirror schedule alive"
            git push
          fi
